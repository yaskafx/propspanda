<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YASKA ROOM — Formation</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#0A0E17;          /* fond global (noir bleuté) */
    --paper:#111725;          /* cartes */
    --paper-2:#0D131F;        /* champs / surfaces creuses */
    --ink:#EEF3FB;            /* texte principal */
    --ink-soft:#AEBAD0;       /* texte secondaire */
    --muted:#6C7A94;          /* texte discret */
    --line:#1E2942;           /* bordures */
    --line-soft:#18213558;    /* bordures douces */
    --clay:#3B82F6;           /* accent bleu */
    --clay-deep:#2563EB;      /* accent bleu profond */
    --clay-tint:#152444;      /* halo bleu discret */
    --espresso-1:#070B14;     /* vignette module — fond */
    --espresso-2:#0E1930;
    --espresso-3:#16305C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 22px 55px rgba(6,20,50,.55);
    --serif:"Space Grotesk", "Newsreader", Georgia, sans-serif;
    --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --r:16px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:6px}

  .hidden{display:none !important}

  /* ============ LOGIN ============ */
  .auth{
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:32px 20px;
    background:
      radial-gradient(70% 55% at 50% -5%, rgba(59,130,246,.20), transparent 70%),
      radial-gradient(50% 40% at 80% 100%, rgba(37,99,235,.10), transparent 70%),
      var(--cream);
  }
  .auth-card{
    width:100%;
    max-width:420px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow-lg);
    padding:44px 40px 34px;
    animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .mark{
    display:flex;align-items:center;gap:11px;
    justify-content:center;margin-bottom:26px;
  }
  .mark-glyph{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(150deg,var(--clay),var(--clay-deep));
    display:grid;place-items:center;color:#fff;flex:none;
    box-shadow:0 4px 12px rgba(177,87,56,.35);
  }
  .mark-glyph svg{width:18px;height:18px}
  .wordmark{
    font-family:var(--serif);
    font-weight:700;
    font-size:20px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#F5F8FF;
  }
  .wordmark .rm{color:var(--clay)}

  .auth h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:26px;
    line-height:1.2;
    text-align:center;
    letter-spacing:.01em;
  }... (2Morestants)
